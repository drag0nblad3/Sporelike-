name: Build game

# Builds an Android APK and a Windows .exe on every push and pull request.
# Pushes to main also update the "Latest playtest build" release, which gives
# a fixed download link you can open on your phone.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5.1"
  GODOT_STATUS: "stable"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and export templates
        run: |
          V="${GODOT_VERSION}-${GODOT_STATUS}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          curl -fsSL -o /tmp/godot.zip "${BASE}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv "/tmp/godot/Godot_v${V}_linux.x86_64" /usr/local/bin/godot
          curl -fsSL -o /tmp/templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpz
          TDIR="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "${TDIR}"
          mv /tmp/tpz/templates/* "${TDIR}/"
          godot --headless --version

      - name: Configure Android signing and SDK
        run: |
          KEYSTORE="${GITHUB_WORKSPACE}/ci/debug.keystore"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          mkdir -p "${HOME}/.config/godot"
          for name in editor_settings-4.tres "editor_settings-${GODOT_VERSION%.*}.tres"; do
          cat > "${HOME}/.config/godot/${name}" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${SDK}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${KEYSTORE}"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=${KEYSTORE}"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "${GITHUB_ENV}"
          # A rising version code lets each build install over the last one.
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg

      - name: Import project
        run: godot --headless --path . --import

      - name: Smoke test (15 game-seconds headless, several short generations)
        run: |
          godot --headless --path . --fixed-fps 60 --quit-after 900 -- --smoke 2>&1 | tee /tmp/run.log
          # Ignore Godot's shutdown-only leak report: classes that reference
          # each other (Ecosystem <-> SpeciesCell) are freed after it prints.
          if grep -E "SCRIPT ERROR|Parse Error|^ERROR" /tmp/run.log \
              | grep -v "resources still in use at exit"; then
            echo "::error::The game logged errors while running. See the lines above."
            exit 1
          fi
          # The run must get through several generations and mutation picks.
          GENS=$(grep -c "smoke: generation" /tmp/run.log || true)
          if [ "${GENS}" -lt 3 ]; then
            echo "::error::Expected at least 3 generations in the smoke test, saw ${GENS}."
            exit 1
          fi

      - name: Export Android APK
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/sporelike.apk
          test -s build/android/sporelike.apk

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows" build/windows/Sporelike.exe
          test -s build/windows/Sporelike.exe
          (cd build/windows && zip -q ../Sporelike-windows.zip Sporelike.exe)

      - uses: actions/upload-artifact@v4
        with:
          name: sporelike-builds
          path: |
            build/android/sporelike.apk
            build/Sporelike-windows.zip

      - name: Publish latest playtest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete playtest --yes --cleanup-tag || true
          gh release create playtest \
            build/android/sporelike.apk \
            build/Sporelike-windows.zip \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "Latest playtest build" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). On Android, download sporelike.apk and open it to install."
